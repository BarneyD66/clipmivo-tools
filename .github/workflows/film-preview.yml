name: Film preview tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test skills/clipmivo-film/tests/film.test.mjs
      - run: python -m py_compile skills/clipmivo-film/scripts/edit.py skills/clipmivo-film/tests/make-fixture.py
